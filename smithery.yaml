startCommand:
  type: http
  configSchema:
    type: object
    properties:
      HIVE_IMPRIMATUR_URL:
        type: string
        description: Upstream Imprimatur surface base URL.
        default: https://hive-passport.onrender.com
  commandFunction: |
    (config) => ({
      command: "node",
      args: ["server.js"],
      env: { HIVE_IMPRIMATUR_URL: config.HIVE_IMPRIMATUR_URL || "https://hive-passport.onrender.com" }
    })
